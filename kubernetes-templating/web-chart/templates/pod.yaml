apiVersion: v1
kind: Pod
metadata:
  name: homework-pod
  namespace: {{ .Values.namespace }}
spec:
  initContainers:
  - name: init-container
    image: {{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}
    command:
      - sh
      - -c
      - "echo '<h1>Hello from Kubernetes!</h1>' > /init/index.html"
    volumeMounts:
    - name: shared-volume
      mountPath: /init
  containers:
  - name: web-container
    image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
    ports:
    - containerPort: {{ .Values.port }}
    volumeMounts:
    - name: shared-volume
      mountPath: /homework
    lifecycle:
      preStop:
        exec:
          command: ["rm", "-f", "/homework/index.html"]
    {{- if .Values.livenessProbe }}
    livenessProbe:
      httpGet:
        path: /
        port: {{ .Values.port }}
    {{- end }}
    {{- if .Values.readinessProbe }}
    readinessProbe:
      httpGet:
        path: /
        port: {{ .Values.port }}
    {{- end }}
  volumes:
  - name: shared-volume
    emptyDir: {}